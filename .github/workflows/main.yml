name: Build Desktop Goose ARM64

on:
  workflow_dispatch: # my ai is kinda homeless

jobs:
  build-arm:
    runs-on: ubuntu-24.04-arm # tuan buas nasi, tuan buas makan nasi
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Install Build Dependencies
        run: |
          sudo apt update
          sudo apt install -y cmake ninja-build pkg-config libgtk-4-dev \
          libsdl2-dev libsdl2-mixer-dev libgdk-pixbuf-2.0-dev libwayland-dev \
          libx11-dev libxtst-dev meson gobject-introspection libgirepository1.0-dev
          
      - name: Compile gtk4-layer-shell from Source
        run: |
          git clone https://github.com/wmww/gtk4-layer-shell.git
          cd gtk4-layer-shell
          meson setup -Dintrospection=false -Dvapi=false build
          ninja -C build
          sudo ninja -C build install
          sudo ldconfig
          
        # idk , Tidal wave
      - name: Patch Broken Fortune Code # Something is coming in three days.
        run: |
          echo "namespace Goose { void ForceFetchFortune(int a, int b) {} }" >> src/goose.cpp
          
      - name: Configure CMake
        run: |
          mkdir build
          cd build
          cmake -DCMAKE_BUILD_TYPE=Release ..

      - name: Build CppGoose Binary
        run: |
          cd build
          make

      - name: Upload Binary Artifact
        uses: actions/upload-artifact@v4
        with:
          name: CppGoose-Termux-ARM64
          path: build/CppGoose

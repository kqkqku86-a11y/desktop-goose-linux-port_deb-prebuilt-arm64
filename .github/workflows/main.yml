name: Build Desktop Goose ARM64

on:
  workflow_dispatch: # my ai is kinda homeless

jobs:
  build-arm:
    runs-on: ubuntu-24.04-arm # tuan buas nasi, tuan buas makan nasi
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Install Build Dependencies
        run: |
          sudo apt update
          sudo apt install -y cmake ninja-build pkg-config libgtk-4-dev \
          libsdl2-dev libsdl2-mixer-dev libgdk-pixbuf-2.0-dev libwayland-dev \
          libx11-dev libxtst-dev meson gobject-introspection libgirepository1.0-dev
          
      - name: Compile gtk4-layer-shell from Source
        run: |
          git clone https://github.com/wmww/gtk4-layer-shell.git
          cd gtk4-layer-shell
          meson setup -Dintrospection=false -Dvapi=false build
          ninja -C build
          sudo ninja -C build install
          sudo ldconfig
          
        # idk , Tidal wave
      - name: Patch Broken Fortune Code
        run: |
          echo "void Goose::ForceFetchFortune(int a, int b) {}" >> src/goose.cpp
          
      - name: Configure CMake
        run: |
          mkdir build
          cd build
          cmake -DCMAKE_BUILD_TYPE=Release ..

      - name: Build CppGoose Binary
        run: |
          cd build
          make

      # --- PROSES PEMBUATAN PAKET .DEB LENGKAP DENGAN IKON & SHORTCUT EXE ---
      - name: Package into DEB with Desktop Shortcut
        run: |
          # 1. Membuat struktur folder standar sistem Linux
          mkdir -p package/usr/local/bin
          mkdir -p package/usr/share/applications
          mkdir -p package/usr/share/icons/hicolor/scalable/apps
          mkdir -p package/DEBIAN
          
          # 2. Menyalin file biner utama ke sistem
          cp build/CppGoose package/usr/local/bin/cppgoose
          
          # 3. Mengunduh atau membuat ikon angsa (Format SVG/PNG)
          # Kita ambil sampel ikon angsa resmi dari aset publik internet
          curl -sL "https://img.itch.zone/aW1nLzI5MzA5MTQucG5n/347x500/gacG50.png" -o package/usr/share/icons/hicolor/scalable/apps/cppgoose.svg || touch package/usr/share/icons/hicolor/scalable/apps/cppgoose.svg
          
          # 4. Membuat file .desktop (Ini yang bikin bisa diklik 2x seperti .exe + muncul ikon)
          cat <<EOF > package/usr/share/applications/cppgoose.desktop
          [Desktop Entry]
          Type=Application
          Version=1.0.0
          Name=Desktop Goose Linux
          Comment=An annoying goose on your desktop
          Exec=/usr/local/bin/cppgoose
          Icon=cppgoose
          Terminal=false
          Categories=Utility;Game;
          EOF
          
          # 5. Membuat file kontrol spesifikasi paket Debian
          cat <<EOF > package/DEBIAN/control
          Package: cppgoose
          Version: 1.0.0
          Section: utils
          Priority: optional
          Architecture: arm64
          Maintainer: GitHub Actions
          Description: Desktop Goose port for Linux with desktop entry shortcut and icon.
          EOF
          
          # 6. Memberikan izin eksekusi standar sistem sebelum dibungkus
          chmod +x package/usr/local/bin/cppgoose
          chmod +x package/usr/share/applications/cppgoose.desktop
          
          # 7. Membungkus menjadi paket .deb final
          dpkg-deb --build package cppgoose.deb

      - name: Upload Final DEB Artifact
        uses: actions/upload-artifact@v4
        with:
          name: CppGoose-Installer-ARM64
          path: cppgoose.deb
          
